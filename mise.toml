# https://mise.jdx.dev
# Mise pins the tools and runs the repository's tasks. See AGENTS.md.

min_version = "2026.10.24"

[settings]
experimental = true
pin = true
lockfile = true
# A lock adds only this platform's entries instead of rebuilding every
# platform, which fails for tools that some platforms lack.
lockfile_mode = "merge"
# The OpenHarmony SDK and the emulator image are gigabytes, so a Git hook or
# `mise run check` never installs them on the way. `mise install` does.
auto_install_disable_tools = ["ohos-sdk", "http:oniro-emulator"]

[vars]
# The MapLibre Native FFI release on ohpm that the library depends on and
# builds against: the facade and its two backends share one version. Keep it
# equal to the facade's version in library/oh-package.json5.
ffi_version = "0.202611.0"
# Oniro publishes its emulator image against the matching OpenHarmony release.
# Keep the SDK and emulator on the same version.
ohos_sdk_version = "7.0"

[tools]
"github:jdx/hk" = "2.11.1"
"aqua:dprint/dprint" = "0.64.3"
"aqua:jdx/jactionlint" = "2.4.0"
"aqua:koalaman/shellcheck" = "0.11.0"
"aqua:jqlang/jq" = "1.8.2"
# ets-loader, the SDK's ArkTS compiler front end, runs on Node.
"core:node" = "26.13.0"
# Installs the documentation site's packages in docs/.
"aqua:pnpm/pnpm" = "12.17.0"
# The SDK packs and signs HAPs with Java tools.
"core:java" = "zulu-25.38.109.0"
# devices-cli gives each worktree its own emulator. It has no releases, so mise
# builds it with Go.
"core:go" = "1.27.3"
"go:github.com/sargunv/devices-cli" = { version = "v0.0.0-20261029084046-1fb50144e197", os = [
  "linux",
  "macos",
] }
# mise has no registry entry for the OpenHarmony SDK, so it resolves through
# the plugin in [plugins]. The plugin unpacks the SDK with python3 from the
# host.
ohos-sdk = { version = "{{vars.ohos_sdk_version}}", os = ["linux", "macos"] }
"http:oniro-emulator" = { version = "{{vars.ohos_sdk_version}}", url = "https://github.com/eclipse-oniro4openharmony/device_board_oniro/releases/download/v{{ version }}/oniro_emulator.zip", checksum = "sha256:5db9a636f04f3115e97e5d6daf96316c680642ad90ea9e275adc4f0382cf0109", size = "969434898", bin_path = ".", os = [
  "linux",
  "macos",
] }
# hypium, the OpenHarmony test framework. The test task parses the report it
# prints, so it is pinned.
"http:hypium" = { version = "1.0.29", url = "https://ohpm.openharmony.cn/ohpm/@ohos/hypium/-/hypium-{{ version }}.har", format = "tar.gz", checksum = "sha256:c81d27c4098d9d3beafffa9602e5f45388bf8107a766bdbca1c8494e67074798", bin_path = ".", os = [
  "linux",
  "macos",
] }
# MapLibre Native FFI's facade and backends, which the builds bundle.
"http:maplibre-native-ffi" = { version = "{{vars.ffi_version}}", url = "https://ohpm.openharmony.cn/ohpm/@maplibre/native-ffi/-/native-ffi-{{ version }}.har", format = "tar.gz", checksum = "sha256:8cc03475d8f22833f959c85e937805b78603b41daefaa42845d5269702b24be6", bin_path = ".", os = [
  "linux",
  "macos",
] }
"http:maplibre-native-ffi-opengl" = { version = "{{vars.ffi_version}}", url = "https://ohpm.openharmony.cn/ohpm/@maplibre/native-ffi-opengl/-/native-ffi-opengl-{{ version }}.har", format = "tar.gz", checksum = "sha256:8400dc404be16a6e5efd09f5f719e10cb9d6fd50bd166b3969e482b182b61873", bin_path = ".", os = [
  "linux",
  "macos",
] }
"http:maplibre-native-ffi-vulkan" = { version = "{{vars.ffi_version}}", url = "https://ohpm.openharmony.cn/ohpm/@maplibre/native-ffi-vulkan/-/native-ffi-vulkan-{{ version }}.har", format = "tar.gz", checksum = "sha256:f47a2219de46492dc32392d7f9f4753980b4349ccb1baaae5e6973dbcdcf279d", bin_path = ".", os = [
  "linux",
  "macos",
] }

[plugins]
ohos-sdk = "https://github.com/sargunv/mise-ohos-sdk#v0.1.0"

[hooks]
postinstall = ["hk install --mise"]

[tasks.check]
description = "Run every formatter and linter check."
# dprint formats the documentation site's pages with its mdxlint.
depends = ["docs:install"]
run = "hk check --all"

[tasks.fix]
description = "Apply every formatter and linter fix."
depends = ["docs:install"]
run = "hk fix --all"

[tasks.pack]
description = "Pack the library into an OHPM source HAR in build/har."
run = "scripts/pack-har.sh library build/har"

[tasks."demo:build"]
description = "Build and sign the demo HAP into build/demo/<abi> against the packed library and the pinned FFI release."
usage = '''
flag "--abi <abi>" default="x86_64" help="The ABI of the native libraries: x86_64 for the Oniro emulator, arm64-v8a for most devices" {
  choices "x86_64" "arm64-v8a"
}
flag "--backend <backend>" default="opengl" help="The FFI backend that the build bundles" {
  choices "opengl" "vulkan"
}
'''
depends = ["pack"]
run = '''
scripts/build-hap.sh demo/entry/src/main "build/demo/$usage_abi" "$usage_abi" \
  build/har/maplibre-arkui.har "$(mise where http:maplibre-native-ffi)/package" \
  "$(mise where "http:maplibre-native-ffi-$usage_backend")/package"
'''

[tasks.demo]
description = "Build the demo for the device's ABI, then install and start it on this worktree's emulator or the device that --device names."
usage = '''
flag "--device <key>" help="The hdc connect key of the device, which defaults to this worktree's emulator"
flag "--backend <backend>" default="opengl" help="The FFI backend that the build bundles" {
  choices "opengl" "vulkan"
}
'''
run = '''
device=${usage_device:-$(scripts/ohos-key.sh)}
abi=$(scripts/device-abi.sh "$device")
mise run demo:build --abi "$abi" --backend "$usage_backend"
hdc -t "$device" install -r "build/demo/$abi/entry.hap"
hdc -t "$device" shell aa start -a EntryAbility -b org.maplibre.arkui.demo
'''

[tasks."test:build"]
description = "Build and sign the library's hypium suite into build/test/<abi> against the packed library and the pinned FFI release."
usage = '''
flag "--abi <abi>" default="x86_64" help="The ABI of the native libraries: x86_64 for the Oniro emulator, arm64-v8a for most devices" {
  choices "x86_64" "arm64-v8a"
}
flag "--backend <backend>" default="opengl" help="The FFI backend that the build bundles" {
  choices "opengl" "vulkan"
}
'''
depends = ["pack"]
run = '''
scripts/build-hap.sh library/src/ohosTest "build/test/$usage_abi" "$usage_abi" \
  build/har/maplibre-arkui.har "$(mise where http:maplibre-native-ffi)/package" \
  "$(mise where "http:maplibre-native-ffi-$usage_backend")/package" "$(mise where http:hypium)/package"
'''

[tasks.test]
description = "Build the library's hypium suite for the device's ABI and run it on this worktree's emulator or the device that --device names."
usage = '''
flag "--device <key>" help="The hdc connect key of the device, which defaults to this worktree's emulator"
flag "--backend <backend>" default="opengl" help="The FFI backend that the build bundles" {
  choices "opengl" "vulkan"
}
'''
run = '''
device=${usage_device:-$(scripts/ohos-key.sh)}
abi=$(scripts/device-abi.sh "$device")
mise run test:build --abi "$abi" --backend "$usage_backend"
# Recheck the emulator's lock screen after boot services settle during the
# build; an explicitly named device is left as it is.
if [[ -z ${usage_device:-} ]]; then
  scripts/wake-device.sh "$device"
fi
scripts/run-tests.sh "$device" "build/test/$abi/entry_test.hap"
'''

[tasks."docs:install"]
description = "Install the documentation site's packages in docs/node_modules."
dir = "docs"
sources = ["package.json", "pnpm-lock.yaml", "pnpm-workspace.yaml"]
outputs = ["node_modules/.modules.yaml"]
run = "pnpm install --frozen-lockfile"

[tasks."docs:api"]
description = "Generate the API reference from the library's doc comments into docs/public/api, against the pinned FFI release."
depends = ["docs:install"]
run = '''
rm -rf build/docs docs/public/api
mkdir -p build/docs/ffi
# FFI's types, as a package that TypeDoc links to FFI's reference: the escape
# hatch's MapHandle and RenderSessionHandle.
cp "$(mise where http:maplibre-native-ffi)/package/index.d.ts" build/docs/ffi/
echo '{ "name": "@maplibre/native-ffi", "types": "index.d.ts" }' > build/docs/ffi/package.json
node docs/scripts/emit-declarations.mjs "$(dirname "$OHOS_SDK_NATIVE")/ets" library/Index.ets \
  build/docs/ffi/index.d.ts build/docs/declarations
(cd docs && pnpm exec typedoc)
node docs/scripts/api-index.mjs docs/public/api docs/src/generated/api-index.json
'''

[tasks."docs:build"]
description = "Build the documentation site, with the API reference, into docs/dist."
depends = ["docs:api"]
dir = "docs"
run = "pnpm exec astro build"

[tasks."docs:dev"]
description = "Serve the documentation site with live reload."
depends = ["docs:api"]
dir = "docs"
run = "pnpm exec astro dev"

[tasks."docs:preview"]
description = "Build the documentation site and serve docs/dist."
depends = ["docs:build"]
dir = "docs"
run = "pnpm exec astro preview"
