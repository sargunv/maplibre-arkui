name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: check
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      # Keeps `mise run check` from installing the rest of the tools.
      MISE_AUTO_INSTALL: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
        with:
          # dprint formats the documentation site's pages with its packages.
          install_args:
            github:jdx/hk aqua:dprint/dprint aqua:jdx/jactionlint
            aqua:koalaman/shellcheck core:node aqua:pnpm/pnpm
      - run: mise run check

  # Builds the library HAR, the demo HAP, the test HAP, and the documentation
  # site against the FFI packages that FFI's CI packed at the pinned commit.
  # The site's API reference needs the SDK too. It doesn't boot the emulator,
  # which needs KVM and a 1.4 GB image.
  build:
    name: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      # actions/configure-pages reads the site's origin.
      pages: read
    timeout-minutes: 30
    env:
      # The Oniro image and devices-cli serve only the tasks that run on the
      # emulator.
      MISE_DISABLE_TOOLS: http:oniro-emulator,go:github.com/sargunv/devices-cli,core:go
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The OpenHarmony SDK is too large to cache well, so each run fetches it,
      # as MapLibre Native FFI's CI does.
      - uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
        with:
          cache: false
      - run: mise run ffi:download
        env:
          GH_TOKEN: ${{ github.token }}
      - run: mise run demo:build
      - run: mise run test:build
      # The deploy builds the site for the origin that Pages serves it at.
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - run: mise run docs:build
        env:
          DOCS_SITE: ${{ steps.pages.outputs.origin }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages
          path: |
            build/har/maplibre-arkui.har
            build/demo/x86_64/entry.hap
            build/test/x86_64/entry_test.hap
          if-no-files-found: error
          retention-days: ${{ github.event_name == 'pull_request' && 1 || 30 }}
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/dist

  # Publishes the documentation site that the build job built from main. Pages
  # takes its build from GitHub Actions in the repository's settings.
  deploy-pages:
    name: deploy-pages
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        id: deploy
